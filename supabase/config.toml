# Supabase Branching deploys only the functions declared under [functions.<slug>].
# All three are declared so preview branches receive fresh function uploads
# automatically. Their source uses only Deno built-ins (no npm imports), which
# keeps each eszip bundle small and avoids the platform's HTTP 413 rejection.
# owner-login and health stay callable without a JWT; monitor-client-errors
# checks CRON_SECRET in the request body instead of a JWT. The JWT behaviour is
# also verified live by scripts/check-supabase.cjs.

[functions.health]
verify_jwt = false

[functions.monitor-client-errors]
verify_jwt = false

[functions.owner-login]
verify_jwt = false

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
