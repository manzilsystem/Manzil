name: Encrypted Supabase backup

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository == 'manzilsystem/Manzil' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install age
        run: |
          sudo apt-get update
          sudo apt-get install --yes age

      - name: Dump and encrypt database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          test -n "$AGE_RECIPIENT"
          timestamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          output="$RUNNER_TEMP/manzil-db-$timestamp.dump.age"

          docker run --rm postgres:17-alpine \
            pg_dump "$SUPABASE_DB_URL" --format=custom --compress=9 --no-owner --no-acl \
            | age --recipient "$AGE_RECIPIENT" --output "$output"

          test -s "$output"
          sha256sum "$output" > "$output.sha256"

      - name: Store encrypted backup for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: manzil-encrypted-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/manzil-db-*.dump.age
            ${{ runner.temp }}/manzil-db-*.dump.age.sha256
          if-no-files-found: error
          retention-days: 30
