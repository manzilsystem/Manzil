name: Supabase database backup

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-backup.yml"

permissions:
  contents: read

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository == 'manzilsystem/Manzil' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare IPv4-compatible Supabase session-pooler credentials
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"

          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const projectRef = 'musvcrkljccubwbcrtjs';
          const url = new URL(process.env.SUPABASE_DB_URL);
          if (!url.password) throw new Error('SUPABASE_DB_URL has no database password');

          const password = decodeURIComponent(
            url.password.replace(/%(?![0-9a-fA-F]{2})/g, '%25')
          );
          const delimiter = `GH_ENV_${crypto.randomUUID()}`;
          fs.appendFileSync(process.env.GITHUB_ENV,
            `PGPASSWORD<<${delimiter}\\n${password}\\n${delimiter}\\n` +
            `PGHOST=aws-eu-north-1.pooler.supabase.com\\n` +
            `PGPORT=5432\\nPGUSER=postgres.${projectRef}\\nPGDATABASE=postgres\\nPGSSLMODE=require\\n`
          );
          NODE

      - name: Dump database
        run: |
          set -euo pipefail
          test -n "$PGPASSWORD"
          timestamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          filename="manzil-db-$timestamp.dump"

          docker run --rm \
            -e PGPASSWORD -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE -e PGSSLMODE \
            -e BACKUP_FILENAME="$filename" \
            -v "$RUNNER_TEMP:/backup" \
            postgres:17-alpine \
            sh -c 'pg_dump --host="$PGHOST" --port="$PGPORT" --username="$PGUSER" --dbname="$PGDATABASE" --no-password --format=custom --compress=9 --no-owner --no-acl --file="/backup/$BACKUP_FILENAME"'

          test -s "$RUNNER_TEMP/$filename"
          sha256sum "$RUNNER_TEMP/$filename" > "$RUNNER_TEMP/$filename.sha256"
          echo "BACKUP_TAG=backup-$timestamp" >> "$GITHUB_ENV"
          echo "BACKUP_FILE=$filename" >> "$GITHUB_ENV"

      - name: Upload to private backup repository
        env:
          GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh release create "$BACKUP_TAG" \
            "$RUNNER_TEMP/$BACKUP_FILE" \
            "$RUNNER_TEMP/$BACKUP_FILE.sha256" \
            --repo manzilsystem/manzil_backups \
            --title "Manzil database backup $BACKUP_TAG" \
            --notes "Automated PostgreSQL custom-format backup. Verify with the accompanying SHA-256 file."

      - name: Retain latest 30 backups
        env:
          GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          set -euo pipefail
          gh release list --repo manzilsystem/manzil_backups --limit 1000 --json tagName,createdAt \
            | jq -r 'sort_by(.createdAt) | reverse | .[30:][] | .tagName' \
            | while IFS= read -r tag; do
                [ -n "$tag" ] || continue
                gh release delete "$tag" --repo manzilsystem/manzil_backups --yes --cleanup-tag
              done
