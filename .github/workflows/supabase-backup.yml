name: Supabase database backup

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository == 'manzilsystem/Manzil' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          timestamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          filename="manzil-db-$timestamp.dump"

          docker run --rm \
            -e SUPABASE_DB_URL \
            -e BACKUP_FILENAME="$filename" \
            -v "$RUNNER_TEMP:/backup" \
            postgres:17-alpine \
            sh -c 'pg_dump "$SUPABASE_DB_URL" --format=custom --compress=9 --no-owner --no-acl --file="/backup/$BACKUP_FILENAME"'

          test -s "$RUNNER_TEMP/$filename"
          sha256sum "$RUNNER_TEMP/$filename" > "$RUNNER_TEMP/$filename.sha256"

      - name: Store backup for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: manzil-database-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/manzil-db-*.dump
            ${{ runner.temp }}/manzil-db-*.dump.sha256
          if-no-files-found: error
          retention-days: 30
