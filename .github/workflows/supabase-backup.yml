name: Supabase database backup

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      request_id:
        description: "Manzil backup request ID"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-backup.yml"

permissions:
  contents: read

concurrency:
  group: supabase-database-maintenance
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository == 'manzilsystem/Manzil' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare IPv4-compatible Supabase session-pooler credentials
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"

          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const projectRef = 'musvcrkljccubwbcrtjs';
          const url = new URL(process.env.SUPABASE_DB_URL);
          if (!url.password) throw new Error('SUPABASE_DB_URL has no database password');

          const encodedPassword = url.password.replace(/%(?![0-9a-fA-F]{2})/g, '%25');
          const password = decodeURIComponent(encodedPassword);
          process.stdout.write(`::add-mask::${password}\n`);
          process.stdout.write(`::add-mask::${encodedPassword}\n`);
          const delimiter = `GH_ENV_${crypto.randomUUID()}`;
          fs.appendFileSync(process.env.GITHUB_ENV,
            `PGPASSWORD<<${delimiter}\n${password}\n${delimiter}\n` +
            `PGPASSWORD_ENCODED<<${delimiter}\n${encodedPassword}\n${delimiter}\n` +
            `PGPORT=5432\nPGDATABASE=postgres\nPGSSLMODE=require\n`
          );
          NODE

      - name: Dump database
        run: |
          set -euo pipefail
          test -n "$PGPASSWORD"
          timestamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          filename="manzil-db-$timestamp.dump"

          backup_ok=false
          for index in 0 1 2 3 4 5; do
            candidate="aws-$index-eu-north-1.pooler.supabase.com"
            if ! getent ahostsv4 "$candidate" >/dev/null 2>&1; then
              continue
            fi

            echo "Trying Supabase pooler cluster index $index"
            for password_mode in decoded encoded; do
              if [ "$password_mode" = decoded ]; then
                candidate_password="$PGPASSWORD"
              else
                candidate_password="$PGPASSWORD_ENCODED"
              fi

              if docker run --rm \
                -e PGPASSWORD="$candidate_password" -e PGPORT -e PGDATABASE -e PGSSLMODE \
                -e PGHOST="$candidate" -e BACKUP_FILENAME="$filename" \
                -v "$RUNNER_TEMP:/backup" \
                postgres:17-alpine \
                sh -c 'pg_dump --host="$PGHOST" --port="$PGPORT" --username="postgres.musvcrkljccubwbcrtjs" --dbname="$PGDATABASE" --no-password --format=custom --compress=9 --no-owner --no-acl --exclude-table=public.backup_catalog --exclude-table=public.restore_requests --exclude-table=public.backup_requests --file="/backup/$BACKUP_FILENAME"'
              then
                backup_ok=true
                echo "PGHOST=$candidate" >> "$GITHUB_ENV"
                break 2
              fi
            done
          done

          if [ "$backup_ok" != true ]; then
            echo "Could not connect to the assigned Supabase session-pooler cluster."
            exit 1
          fi

          test -s "$RUNNER_TEMP/$filename"
          sha256sum "$RUNNER_TEMP/$filename" > "$RUNNER_TEMP/$filename.sha256"
          # Validate checksum and PostgreSQL custom archive before upload.
          (cd "$RUNNER_TEMP" && sha256sum --check "$filename.sha256")
          docker run --rm -v "$RUNNER_TEMP:/backup" postgres:17-alpine \
            pg_restore --list "/backup/$filename" >/dev/null
          echo "Backup archive and SHA-256 validation passed."
          echo "BACKUP_TAG=backup-$timestamp" >> "$GITHUB_ENV"
          echo "BACKUP_FILE=$filename" >> "$GITHUB_ENV"

      - name: Upload to private backup repository
        env:
          GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api repos/manzilsystem/manzil_backups >/dev/null || {
            echo "::error::BACKUP_REPO_TOKEN cannot access manzilsystem/manzil_backups. Check repository selection and Contents: Read and write permission."
            exit 1
          }
          # GitHub cannot create a Release in a repository with no commits.
          # Seed the private backup repository once, then continue with Releases.
          if ! gh api repos/manzilsystem/manzil_backups/contents/README.md >/dev/null 2>&1; then
            printf '%s\n' '# Manzil database backups' '' 'Private repository for automated database backup releases.' > "$RUNNER_TEMP/README.md"
            gh api --method PUT repos/manzilsystem/manzil_backups/contents/README.md \
              -f message='Initialize private backup repository' \
              -f content="$(base64 -w0 "$RUNNER_TEMP/README.md")" >/dev/null
          fi

          gh release create "$BACKUP_TAG" \
            "$RUNNER_TEMP/$BACKUP_FILE" \
            "$RUNNER_TEMP/$BACKUP_FILE.sha256" \
            --repo manzilsystem/manzil_backups \
            --title "Manzil database backup $BACKUP_TAG" \
            --notes "Automated PostgreSQL custom-format backup. Verify with the accompanying SHA-256 file."

      - name: Register backup in Manzil catalog
        run: |
          set -euo pipefail
          size="$(stat -c '%s' "$RUNNER_TEMP/$BACKUP_FILE")"
          digest="$(awk '{print $1}' "$RUNNER_TEMP/$BACKUP_FILE.sha256")"
          export BACKUP_SIZE="$size" BACKUP_SHA="$digest"
          docker run --rm -e PGPASSWORD -e PGHOST -e PGPORT -e PGDATABASE -e PGSSLMODE \
            postgres:17-alpine psql --no-password --host="$PGHOST" --port="$PGPORT" \
              --username="postgres.musvcrkljccubwbcrtjs" --dbname="$PGDATABASE" -v ON_ERROR_STOP=1 \
              -c "INSERT INTO public.backup_catalog(tag,file_name,size_bytes,sha256) VALUES ('$BACKUP_TAG','$BACKUP_FILE',$size,'$digest') ON CONFLICT(tag) DO UPDATE SET file_name=EXCLUDED.file_name,size_bytes=EXCLUDED.size_bytes,sha256=EXCLUDED.sha256,created_at=now()"

      - name: Clean up stale orphaned backup releases
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$PGPASSWORD"
          registered="$RUNNER_TEMP/registered-backup-tags.txt"
          releases="$RUNNER_TEMP/backup-releases.jsonl"

          docker run --rm -e PGPASSWORD -e PGHOST -e PGPORT -e PGDATABASE -e PGSSLMODE \
            postgres:17-alpine psql --no-password --quiet --tuples-only --no-align \
              --host="$PGHOST" --port="$PGPORT" --username="postgres.musvcrkljccubwbcrtjs" \
              --dbname="$PGDATABASE" -v ON_ERROR_STOP=1 \
              -c "SELECT tag FROM public.backup_catalog" > "$registered"

          gh release list --repo manzilsystem/manzil_backups --limit 1000 \
            --json tagName,createdAt | jq -c '.[]' > "$releases"

          now="$(date -u +%s)"
          while IFS= read -r release; do
            tag="$(jq -r '.tagName' <<< "$release")"
            created_at="$(jq -r '.createdAt' <<< "$release")"
            [[ "$tag" =~ ^backup-[0-9]{8}T[0-9]{6}Z$ ]] || continue
            grep -Fxq -- "$tag" "$registered" && continue

            created_epoch="$(date -u -d "$created_at" +%s)"
            age_seconds=$((now - created_epoch))
            if (( age_seconds >= 86400 )); then
              echo "Removing unregistered backup release older than 24 hours: $tag"
              gh release delete "$tag" --repo manzilsystem/manzil_backups --yes --cleanup-tag
            fi
          done < "$releases"

          # Remove stale catalog entries only after GitHub confirms the release is truly missing.
          # A transient API failure must never delete a potentially valid backup record.
          stale_catalog="$RUNNER_TEMP/stale-catalog-tags.txt"
          docker run --rm -e PGPASSWORD -e PGHOST -e PGPORT -e PGDATABASE -e PGSSLMODE \
            postgres:17-alpine psql --no-password --quiet --tuples-only --no-align \
              --host="$PGHOST" --port="$PGPORT" --username="postgres.musvcrkljccubwbcrtjs" \
              --dbname="$PGDATABASE" -v ON_ERROR_STOP=1 \
              -c "SELECT tag FROM public.backup_catalog WHERE created_at < now() - interval '24 hours'" > "$stale_catalog"

          while IFS= read -r tag; do
            [[ "$tag" =~ ^backup-[0-9]{8}T[0-9]{6}Z$ ]] || continue
            response="$(gh api --include "repos/manzilsystem/manzil_backups/releases/tags/$tag" 2>&1 || true)"
            http_status="$(sed -n '1s#^HTTP/[0-9.]* \([0-9][0-9][0-9]\).*#\1#p' <<< "$response")"

            if [[ "$http_status" == "404" ]]; then
              echo "Removing stale catalog entry for confirmed missing release: $tag"
              docker run --rm -e PGPASSWORD -e PGHOST -e PGPORT -e PGDATABASE -e PGSSLMODE \
                postgres:17-alpine psql --no-password --quiet --host="$PGHOST" --port="$PGPORT" \
                  --username="postgres.musvcrkljccubwbcrtjs" --dbname="$PGDATABASE" -v ON_ERROR_STOP=1 \
                  -c "DELETE FROM public.backup_catalog WHERE tag='$tag' AND created_at < now() - interval '24 hours'"
            elif [[ "$http_status" == "200" ]]; then
              echo "Catalog entry still has a valid GitHub release: $tag"
            else
              echo "Unable to verify GitHub release status for catalog entry $tag (HTTP ${http_status:-unknown})"
              exit 1
            fi
          done < "$stale_catalog"

      - name: Complete manual backup request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.request_id != '' }}
        env:
          BACKUP_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          [[ "$BACKUP_REQUEST_ID" =~ ^[0-9a-f-]{36}$ ]]
          docker run --rm -e PGPASSWORD -e PGHOST -e PGPORT -e PGDATABASE -e PGSSLMODE \
            postgres:17-alpine psql --no-password --host="$PGHOST" --port="$PGPORT" \
              --username="postgres.musvcrkljccubwbcrtjs" --dbname="$PGDATABASE" -v ON_ERROR_STOP=1 \
              -c "UPDATE public.backup_requests SET status='succeeded',finished_at=now(),result_message='تم إنشاء النسخة الاحتياطية وفحصها بنجاح' WHERE id='$BACKUP_REQUEST_ID' AND status='dispatched'"

      - name: Retain latest 30 backups and prune catalog
        env:
          GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          set -euo pipefail
          gh release list --repo manzilsystem/manzil_backups --limit 1000 --json tagName,createdAt \
            | jq -r 'sort_by(.createdAt) | reverse | .[30:][] | .tagName' \
            | while IFS= read -r tag; do
                [ -n "$tag" ] || continue
                [[ "$tag" =~ ^backup-[0-9]{8}T[0-9]{6}Z$ ]]
                gh release delete "$tag" --repo manzilsystem/manzil_backups --yes --cleanup-tag
              done

          # Keep the database catalog bounded to the same 30 most recent registered backups.
          # This also cleans catalog rows left behind if release deletion succeeded but a prior
          # workflow run stopped before catalog maintenance completed.
          docker run --rm -e PGPASSWORD -e PGHOST -e PGPORT -e PGDATABASE -e PGSSLMODE \
            postgres:17-alpine psql --no-password --host="$PGHOST" --port="$PGPORT" \
              --username="postgres.musvcrkljccubwbcrtjs" --dbname="$PGDATABASE" -v ON_ERROR_STOP=1 \
              -c "DELETE FROM public.backup_catalog WHERE tag NOT IN (SELECT tag FROM public.backup_catalog ORDER BY created_at DESC LIMIT 30)"
