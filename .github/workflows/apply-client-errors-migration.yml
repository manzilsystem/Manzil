name: Apply client errors migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    name: Apply supabase/migrations/20261104220000_client_error_reports.sql
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply migration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction \
            -f supabase/migrations/20261104220000_client_error_reports.sql

      - name: Verify table, RLS and grants
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -t -A -F ' ' <<'SQL'
          select 'table=' || to_regclass('public.client_errors')::text;
          select 'rls=' || relrowsecurity from pg_class where oid = 'public.client_errors'::regclass;
          select 'policy=' || count(*) from pg_policy where polrelid = 'public.client_errors'::regclass;
          select 'anon_insert=' || has_table_privilege('anon', 'public.client_errors', 'insert');
          select 'anon_select=' || has_table_privilege('anon', 'public.client_errors', 'select');
          select 'anon_update=' || has_table_privilege('anon', 'public.client_errors', 'update');
          select 'triggers=' || count(*) from pg_trigger where tgrelid = 'public.client_errors'::regclass and not tgisinternal;
          SQL
