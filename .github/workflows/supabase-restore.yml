name: Restore Manzil database backup

# The push trigger also provides an immediate wake-up path for queued maintenance work.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-restore.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: supabase-database-maintenance
  cancel-in-progress: false

jobs:
  restore:
    if: github.repository == 'manzilsystem/Manzil' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Prepare secure database connection
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const url = new URL(process.env.SUPABASE_DB_URL);
          if (!url.password) throw new Error('Missing database password');
          const encoded = url.password.replace(/%(?![0-9a-fA-F]{2})/g, '%25');
          const password = decodeURIComponent(encoded);
          process.stdout.write(`::add-mask::${password}\n`);
          process.stdout.write(`::add-mask::${encoded}\n`);
          const delimiter = `GH_ENV_${crypto.randomUUID()}`;
          fs.appendFileSync(process.env.GITHUB_ENV,
            `PGPASSWORD<<${delimiter}\n${password}\n${delimiter}\nPGPASSWORD_ENCODED<<${delimiter}\n${encoded}\n${delimiter}\nPGPORT=5432\nPGDATABASE=postgres\nPGSSLMODE=require\n`);
          NODE
          for index in 0 1 2 3 4 5; do
            candidate="aws-$index-eu-north-1.pooler.supabase.com"
            if getent ahostsv4 "$candidate" >/dev/null 2>&1; then
              echo "PGHOST=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::No reachable Supabase pooler host"
          exit 1

      - name: Process one approved restore request
        env:
          GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PGPASSWORD: ${{ env.PGPASSWORD }}
          PGHOST: ${{ env.PGHOST }}
          PGPORT: "5432"
          PGDATABASE: postgres
          PGSSLMODE: require
        run: |
          set -euo pipefail
          export GH_TOKEN
          psql_db() {
            docker run --rm -e PGPASSWORD -e PGHOST -e PGPORT -e PGDATABASE -e PGSSLMODE \
              postgres:17-alpine psql --no-password --host="$PGHOST" --port="$PGPORT" \
              --username="postgres.musvcrkljccubwbcrtjs" --dbname="$PGDATABASE" -v ON_ERROR_STOP=1 "$@"
          }

          # Mark abandoned manual backup requests after 30 minutes.
          psql_db -c "UPDATE public.backup_requests SET status='failed',finished_at=now(),result_message='انتهت مهلة تنفيذ النسخ الاحتياطي' WHERE status='dispatched' AND dispatched_at < now() - interval '30 minutes'"

          # Dispatch one manual backup request. The backup workflow shares this concurrency group
          # and starts after this worker exits.
          backup_request_id="$(psql_db -At -c "SELECT id::text FROM public.backup_requests WHERE status='queued' ORDER BY created_at LIMIT 1")"
          if [ -n "$backup_request_id" ]; then
            [[ "$backup_request_id" =~ ^[0-9a-f-]{36}$ ]]
            psql_db -c "UPDATE public.backup_requests SET status='dispatched',dispatched_at=now(),result_message='جارٍ بدء مهمة النسخ الاحتياطي' WHERE id='$backup_request_id' AND status='queued'"
            if GH_TOKEN="$GITHUB_TOKEN" gh workflow run supabase-backup.yml --repo manzilsystem/Manzil --ref main -f request_id="$backup_request_id"; then
              echo "Manual backup workflow dispatched."
            else
              psql_db -c "UPDATE public.backup_requests SET status='failed',finished_at=now(),result_message='تعذر بدء مهمة النسخ الاحتياطي' WHERE id='$backup_request_id' AND status='dispatched'"
            fi
          fi

          # Do not restore while a manual backup is queued or running.
          backup_active="$(psql_db -At -c "SELECT count(*) FROM public.backup_requests WHERE status IN ('queued','dispatched')")"
          if [ "$backup_active" -gt 0 ]; then
            echo "A manual backup is pending or running; restore will wait."
            exit 0
          fi

          # Atomically claim one request. The row lock and status transition happen in one statement.
          request="$(psql_db -At -F '|' -c "WITH next_request AS (SELECT r.id FROM public.restore_requests r WHERE r.status='queued' ORDER BY r.created_at FOR UPDATE SKIP LOCKED LIMIT 1) UPDATE public.restore_requests r SET status='running',started_at=now(),result_message='بدأ تنفيذ الاستعادة' FROM next_request n WHERE r.id=n.id RETURNING r.id::text || '|' || r.backup_tag || '|' || COALESCE((SELECT b.sha256 FROM public.backup_catalog b WHERE b.tag=r.backup_tag), '')")"
          if [ -z "$request" ]; then
            echo "No pending restore request."
            exit 0
          fi
          IFS='|' read -r request_id tag expected_sha <<< "$request"
          [[ "$request_id" =~ ^[0-9a-f-]{36}$ ]]

          restore_failed() {
            psql_db -c "UPDATE public.restore_requests SET status='failed',finished_at=now(),result_message='فشلت الاستعادة؛ تم إلغاء معاملة PostgreSQL إن أمكن' WHERE id='$request_id' AND status='running'" || true
          }
          trap restore_failed ERR

          [[ "$tag" =~ ^backup-[0-9]{8}T[0-9]{6}Z$ ]]
          if [[ ! "$expected_sha" =~ ^[a-f0-9]{64}$ ]]; then
            psql_db -c "UPDATE public.restore_requests SET status='failed',finished_at=now(),result_message='بصمة النسخة غير موجودة أو غير صالحة في سجل النسخ' WHERE id='$request_id' AND status='running'"
            trap - ERR
            echo "::error::Missing or invalid catalog SHA-256"
            exit 1
          fi
          filename="manzil-db-${tag#backup-}.dump"

          gh release download "$tag" --repo manzilsystem/manzil_backups \
            --pattern "$filename" --pattern "$filename.sha256" --dir "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP" && sha256sum --check "$filename.sha256")
          actual_sha="$(sha256sum "$RUNNER_TEMP/$filename" | awk '{print $1}')"
          [[ "$actual_sha" == "$expected_sha" ]] || { echo "::error::Backup digest does not match the trusted database catalog"; exit 1; }
          docker run --rm -v "$RUNNER_TEMP:/backup" postgres:17-alpine \
            pg_restore --list "/backup/$filename" >/dev/null

          docker run --rm -e PGPASSWORD -e PGHOST -e PGPORT -e PGDATABASE -e PGSSLMODE \
            -v "$RUNNER_TEMP:/backup" postgres:17-alpine \
            pg_restore --host="$PGHOST" --port="$PGPORT" \
              --username="postgres.musvcrkljccubwbcrtjs" --dbname="$PGDATABASE" \
              --no-password --clean --if-exists --single-transaction --exit-on-error \
              --no-owner --no-acl "/backup/$filename"

          trap - ERR
          psql_db -c "UPDATE public.restore_requests SET status='succeeded',finished_at=now(),result_message='تمت استعادة النسخة بنجاح. قد تحتاج إلى تسجيل الدخول مرة أخرى.' WHERE id='$request_id' AND status='running'"
          echo "Restore completed for request $request_id."
