name: Quality Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: Node regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Scan tracked files for credentials
        run: npm run check:secrets
      - name: Type-check opted-in modules
        run: npm run typecheck
      - name: Verify generated index.html is current
        run: npm run check:index
      - name: Check hosted Supabase connectivity (informational)
        continue-on-error: true
        run: npm run check:supabase
      - name: Run assistant evaluation gate
        run: node --test --test-name-pattern='assistant fixed evaluation set' tests/assistant.test.cjs
      - name: Upload assistant evaluation report
        if: always() && hashFiles('test-results/assistant-evaluation.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: assistant-evaluation-report
          path: test-results/assistant-evaluation.json
      - name: Run regression tests
        run: node --test tests/*.test.cjs
