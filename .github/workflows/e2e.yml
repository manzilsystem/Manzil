name: Browser E2E

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "icons/**"
      - "manifest.json"
      - "sw.js"
      - "e2e/**"
      - "playwright.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "icons/**"
      - "manifest.json"
      - "sw.js"
      - "e2e/**"
      - "playwright.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/e2e.yml"
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  chromium:
    name: Chromium smoke and settings flows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Push stays fast: smoke + settings only. Full suite still guards PRs
      # and runs nightly so main keeps complete browser coverage.
      - name: "Run browser tests (push: smoke and settings)"
        if: github.event_name == 'push'
        run: npx playwright test e2e/smoke.spec.js e2e/settings.spec.js

      - name: "Run browser tests (pull request / schedule: full suite)"
        if: github.event_name != 'push'
        run: npx playwright test

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
