name: GitHub one-time repository housekeeping

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/github-housekeeping-once.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.repository == 'manzilsystem/Manzil' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prune merged branches and old completed workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const defaultBranch = 'main';
            const failures = [];
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

            if (`${owner}/${repo}` !== 'manzilsystem/Manzil' || context.ref !== 'refs/heads/main') {
              throw new Error('Housekeeping is restricted to manzilsystem/Manzil on main.');
            }

            // Only branches whose PRs were merged are candidates. Open PR heads and
            // protected branches are always retained.
            const [closedPRs, openPRs, branches] = await Promise.all([
              github.paginate(github.rest.pulls.list, { owner, repo, state: 'closed', per_page: 100 }),
              github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 }),
              github.paginate(github.rest.repos.listBranches, { owner, repo, per_page: 100 })
            ]);

            const openHeads = new Set(openPRs
              .filter(pr => pr.head.repo?.full_name === `${owner}/${repo}`)
              .map(pr => pr.head.ref));

            const mergedHeads = new Set(closedPRs
              .filter(pr => pr.merged_at && pr.head.repo?.full_name === `${owner}/${repo}`)
              .map(pr => pr.head.ref));

            // PR #17 was closed without merge because PR #18 replaced it with
            // the refreshed atomic-persistence implementation. Delete that
            // abandoned branch only if both PR states still prove the replacement.
            const supersededPR = closedPRs.find(pr => pr.number === 17);
            const replacementPR = closedPRs.find(pr => pr.number === 18);
            const supersededHeads = new Set();
            if (
              supersededPR &&
              !supersededPR.merged_at &&
              supersededPR.head.ref === 'phase-2-data-integrity' &&
              replacementPR?.merged_at &&
              replacementPR.head.ref === 'phase-2-atomic-persistence-refresh' &&
              !openHeads.has('phase-2-data-integrity')
            ) {
              supersededHeads.add('phase-2-data-integrity');
            }

            const branchCandidates = branches.filter(branch =>
              branch.name !== defaultBranch &&
              !branch.protected &&
              !openHeads.has(branch.name) &&
              (mergedHeads.has(branch.name) || supersededHeads.has(branch.name))
            );

            let deletedBranches = 0;
            for (const branch of branchCandidates) {
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch.name}`
                });
                deletedBranches++;
                core.info(`Deleted stale branch: ${branch.name}`);
              } catch (error) {
                failures.push(`branch ${branch.name}: ${error.message}`);
              }
            }

            // Preserve the latest 10 successful runs for each workflow + event.
            // Remove older successful runs and completed non-success runs only.
            // In-progress runs and this housekeeping run are never touched.
            const allRuns = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 }
            );

            const successfulGroups = new Map();
            for (const run of allRuns) {
              if (
                run.id === context.runId ||
                run.name === 'GitHub one-time repository housekeeping' ||
                run.status !== 'completed' ||
                run.conclusion !== 'success'
              ) continue;

              const key = `${run.workflow_id || run.name}:${run.event}`;
              if (!successfulGroups.has(key)) successfulGroups.set(key, []);
              successfulGroups.get(key).push(run);
            }

            const keepRunIds = new Set();
            for (const group of successfulGroups.values()) {
              group.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
              for (const run of group.slice(0, 10)) keepRunIds.add(run.id);
            }

            const runsToDelete = allRuns.filter(run =>
              run.id !== context.runId &&
              run.name !== 'GitHub one-time repository housekeeping' &&
              run.status === 'completed' &&
              (run.conclusion !== 'success' || !keepRunIds.has(run.id))
            );

            let deletedRuns = 0;
            for (let index = 0; index < runsToDelete.length; index += 2) {
              const batch = runsToDelete.slice(index, index + 2);
              const outcomes = await Promise.allSettled(batch.map(run =>
                github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id })
              ));

              outcomes.forEach((outcome, offset) => {
                const run = batch[offset];
                if (outcome.status === 'fulfilled') {
                  deletedRuns++;
                } else {
                  failures.push(`workflow run ${run.id}: ${outcome.reason?.message || 'delete failed'}`);
                }
              });

              if (index + 2 < runsToDelete.length) await sleep(1500);
            }

            core.info(`Deleted ${deletedBranches} stale branches.`);
            core.info(`Deleted ${deletedRuns} old/unsuccessful workflow runs; retained the latest 10 successful runs per workflow and event.`);

            if (failures.length) {
              core.setFailed(`Housekeeping completed with ${failures.length} deletion errors: ${failures.slice(0, 20).join(' | ')}`);
              return;
            }

            // Self-remove the one-off workflow so no permanent cleanup workflow remains.
            const workflowPath = '.github/workflows/github-housekeeping-once.yml';
            const currentFile = await github.rest.repos.getContent({
              owner,
              repo,
              path: workflowPath,
              ref: defaultBranch
            });
            if (Array.isArray(currentFile.data) || !currentFile.data.sha) {
              throw new Error('Could not verify the one-off workflow file before self-removal.');
            }

            await github.rest.repos.deleteFile({
              owner,
              repo,
              path: workflowPath,
              message: 'chore: remove one-time GitHub housekeeping workflow',
              sha: currentFile.data.sha,
              branch: defaultBranch
            });

            core.info('Removed the one-time housekeeping workflow from main.');
