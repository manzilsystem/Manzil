name: Delete client errors smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete the post-migration smoke test row
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Delete row
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction -c \
            "delete from public.client_errors where kind = 'manual' and message = 'post-migration smoke test';"

      - name: Confirm removal
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -t -A -c \
            "select 'remaining=' || count(*) from public.client_errors where message = 'post-migration smoke test';"
