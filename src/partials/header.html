    <!-- Header -->
    <header class="app-card sticky top-0 z-30 border-b no-print">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center max-w-4xl">
            <div class="flex items-center gap-3">
                <div class="header-brand-mark" aria-hidden="true"><img src="icons/manzil-logo.png" alt="" width="44" height="44" decoding="async"></div>
                <div>
                    <h1 id="headerBuildingTitle" class="text-base font-extrabold leading-tight tracking-wide">Manzil</h1>
                    <p class="text-[10px] text-slate-400 flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
                        <span id="syncStatus" role="status" aria-live="polite">جاري التحقق...</span>
                    </p>
                </div>
            </div>
            <div class="flex items-center gap-1.5">
                <div class="owner-theme-control" id="ownerThemeControl">
                    <button type="button" id="ownerThemeBtn" class="owner-theme-btn app-card border" onclick="toggleOwnerThemeMenu()" aria-haspopup="true" aria-expanded="false" aria-controls="ownerThemeMenu" aria-label="تغيير مظهر البوابة" title="مظهرك المفضل">
                        <span class="owner-theme-swatch theme-preview-dark" id="ownerThemeSwatch" aria-hidden="true"></span>
                        <i class="fa-solid fa-palette" aria-hidden="true"></i>
                    </button>
                    <div class="owner-theme-menu app-card border hidden" id="ownerThemeMenu" role="group" aria-label="اختيار مظهر البوابة"></div>
                </div>
                <div class="manager-notifications-control hidden" id="managerNotificationsControl">
                    <button type="button" id="managerNotificationsBtn" class="app-card border p-2.5 rounded-xl text-xs transition relative" onclick="toggleManagerNotifications()" aria-haspopup="true" aria-expanded="false" aria-controls="managerNotificationsMenu" aria-label="إشعارات المدير" title="الإشعارات">
                        <i class="fa-solid fa-bell text-sm"></i>
                        <span id="managerNotificationsBadge" class="manager-notifications-badge hidden" aria-hidden="true"></span>
                    </button>
                    <div class="manager-notifications-menu app-card border hidden" id="managerNotificationsMenu" role="group" aria-label="إشعارات المدير"></div>
                </div>
                <button onclick="openSettingsModal()" aria-label="فتح الإعدادات" class="app-card border p-2.5 rounded-xl text-xs transition" title="الإعدادات"><i class="fa-solid fa-gear text-sm"></i></button>
                <button id="accessSwitchBtn" onclick="lockCurrentSession()" aria-label="تبديل المستخدم أو قفل التطبيق" class="app-card border p-2.5 rounded-xl text-xs transition hidden" title="خروج / تبديل المستخدم"><i class="fa-solid fa-right-from-bracket text-sm"></i></button>
            </div>
        </div>
    </header>
